plugins {
    id 'java'
    id 'war'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.platform:jakarta.jakartaee-api:11.0.0')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}

// --- GLASSFISH AUTODEPLOY CONFIGURATION ---

// Update this path if your GlassFish is installed in a different location
def glassfishAutodeployDir = 'C:/glassfish8/glassfish/domains/domain1/autodeploy'

tasks.register('deployToGlassfish', Copy) {
    group = 'deployment'
    description = 'Builds the WAR and copies it to the GlassFish autodeploy directory.'

    // Ensure the war is built before trying to copy it
    dependsOn tasks.named('war')

    from tasks.named('war').flatMap { it.archiveFile }
    into glassfishAutodeployDir

    doLast {
        println "SUCCESS: Deployed ${tasks.named('war').get().archiveFileName.get()} to ${glassfishAutodeployDir}"
    }
}